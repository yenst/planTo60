name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          lua5.1 tests/run.lua
          lua5.1 tests/smoke.lua
